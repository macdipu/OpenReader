name: open_reader_kit
description: >-
  Open and read PDF, Word (.docx), Excel (.xlsx), CSV, PowerPoint (.pptx)
  and text documents in Flutter, with its own document engines.
version: 0.1.0
publish_to: none # Until the user's first pub.dev release (see README).

environment:
  # The engine code (from excel_plus 2.22.0 / pdfrx 2.4.8) needs these.
  sdk: ^3.11.4
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  code_assets: ^2.1.0
  collection: ^1.19.1
  crypto: ^3.0.7
  equatable: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.9.2
  markdown: ^7.3.1
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  rxdart: ^0.28.0
  synchronized: ^3.4.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  vector_math: ^2.2.0
  web: ^1.1.1
  xml: ^7.0.1
  yaml: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # PDFium for iOS/macOS comes from the xcframework in darwin/; every
      # other platform gets it from hook/build.dart.
      ios:
        pluginClass: OpenReaderKitPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      macos:
        pluginClass: OpenReaderKitPlugin
        ffiPlugin: true
        sharedDarwinSource: true
  assets:
    # PDFium WASM build for the web PDF engine.
    - path: assets/pdfium/
      platforms: [web]
