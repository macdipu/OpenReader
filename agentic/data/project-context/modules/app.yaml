known_risks:
  - 124 tests across the files above (flutter analyze: 0 errors/warnings, 152 pre-existing infos); 122/124 pass — 2 pre-existing failures in document_scanner_service_test.dart from a Windows-path-separator bug in DocumentScannerService._nameOf() (splits on '/' only), invisible on CI's ubuntu-latest runner and on real Android, not yet fixed (see FEATURE-OPENREADER-P5/tasks/TASK-013.md); Settings/Onboarding widget coverage and a real device/large-file corpus pass remain outside that scope
  - CI config added 2026-09-19 (.github/workflows/ci.yml) — flutter analyze/flutter test now run on push/PR to main (ODF-P5-07, TASK-013.md)
  - .env fix done 2026-09-19 — flutter_dotenv removed, env moved to compile-time constants (ODF-P5-01, commit 2aeae27)
  - PDF/Word/Excel/Text/CSV readers, Share/File Info/Open With, and Open From Other Apps (TASK-009) are all implemented (2026-09-18); PowerPoint has no reader, blocked on an undecided product question (FEATURE-OPENREADER-P3/SRS.md Unresolved Question 1)
  - FIXED (2026-09-19): first real-device run (Android 17/API 37 emulator, first ever in this project) found the app never got past its splash screen. Root cause: SplashView never reads GetView.controller, and SplashBinding registered SplashController with Get.lazyPut, so it was never instantiated and its onInit() (bootstrap-and-navigate) never ran — unrelated to FlutterSecureStorage/sqflite/shared_preferences, which were red herrings chased first. Fixed via eager Get.put in SplashBinding. Verified end-to-end: splash -> onboarding -> app shell all render correctly. AppSettingsRepositoryImpl was also switched from FlutterSecureStorage to plain shared_preferences (non-sensitive values, already a dependency) as a real but separate improvement. See FEATURE-OPENREADER-P5/tasks/TASK-013.md for full diagnostic trail. Native rendering (PDF/Word) and real intent delivery (TASK-009) can now actually be exercised on-device for the first time, but have not yet been manually walked through beyond reaching the app shell
  - A testWidgets test combining an import that reaches document_repository_impl.dart (sqflite) with Directory.systemTemp.createTemp() hangs flutter_test's own teardown in this Flutter 3.44.4 environment (found while testing TASK-009's IncomingIntentService) - worth keeping in mind for future test files in this module
