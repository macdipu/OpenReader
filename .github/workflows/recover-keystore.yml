name: Recover signing keystore

# One-off manual recovery tool - pulls the signing keystore + credentials
# back out of repo secrets into a downloadable artifact. Delete this
# workflow file once you've recovered what you need; it should not stay
# in the repo long-term since the artifact it produces contains secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on a public repo
        if: github.event.repository.private != true
        run: |
          echo "::error::Repo is public - refusing to expose signing secrets via artifact. Make the repo private first, then re-run."
          exit 1

      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p recovered
          echo "$KEYSTORE_BASE64" | base64 --decode > recovered/upload-keystore.jks
          cat > recovered/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovered-keystore
          path: recovered/
          retention-days: 1
