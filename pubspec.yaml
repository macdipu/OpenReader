name: openreader
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.23+23

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  get: ^4.7.3

  # Storage
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  # Desktop (Windows/macOS/Linux): sqflite has no desktop implementation, so
  # the FFI factory is installed at startup (see lib/app/flavours/app_flavour.dart).
  # The native SQLite library is bundled by the sqlite3 package's build hook.
  sqflite_common_ffi: ">=2.3.6 <2.4.0"
  path: ^1.9.0

  # Logging / Utilities
  logger: ^2.7.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  intl: ^0.20.2


  # Media / Files
  file_picker: ^11.0.2
  # Desktop drag-and-drop to open a file (ADR-OPENREADER-desktop-drop, UX-34).
  desktop_drop: ^0.4.4
  open_filex: ^4.7.0
  # TASK-009 (Open From Other Apps, BRD §7.7): receives ACTION_VIEW/
  # ACTION_SEND intents for supported document types.
  receive_sharing_intent: ^1.9.0
  # Every document engine (PDF, Word, Excel/CSV) is universal_document_viewer's own
  # code (CR-OPENREADER-KIT; origins in its NOTICE.md). OpenReader is the
  # kit's example app. The package has its own repository and is published on
  # pub.dev. To work on both at once, use a pubspec_overrides.yaml with
  # `path: ../universal_document_viewer`.
  universal_document_viewer: ^0.4.0
  # On-device OCR for scanned PDF pages (CR-READER-SELECT-OCR SO-14), Android
  # only for now. The Latin model is bundled: no network, no model download.
  google_mlkit_text_recognition: ^1.0.3


  # Platform / Device
  path_provider: ^2.1.5
  # Already resolved transitively; direct so the desktop updater can verify the
  # SHA-256 of a downloaded installer (CR-PERMISSIONS-NAV-AUDIT B-01).
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  permission_handler: ^12.0.2
  package_info_plus: ^9.0.0
  in_app_update: ^5.0.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  wakelock_plus: ^1.8.0
  dynamic_color: ^2.1.0
  printing: ^5.15.1

dev_dependencies:
  # Tests build DOCX/XLSX ZIP fixtures.
  archive: ^4.5.0
  flutter_test:
    sdk: flutter

  # Linting / Tooling
  flutter_lints: ^6.0.0

  # App Branding / Assets
  # rename_app removed: it hard-pins xml ^6.5.0 (even at its latest 1.6.6),
  # which conflicts with the xml ^7.0.1 requirement. It's a one-shot
  # setup CLI (rename the bundle ID/app name), not referenced anywhere else
  # in this repo - see ADR-OPENREADER-office-libraries.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  fake_async: any
flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

  # OpenReader is offline-only (BRD - zero network calls), so type is bundled
  # as local variable-font assets instead of package:google_fonts' default
  # runtime-download behavior. Each weight below maps onto the same variable
  # font file; Flutter/Skia renders the matching instance.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500

# Every asset comes from one master drawing: flutter test tool/generate_app_icon.dart
# then dart run flutter_launcher_icons.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    background_color: "#0B1120"
    theme_color: "#0B1120"
  windows:
    generate: true
    image_path: "assets/icon/icon_rounded.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon_rounded.png"

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#000000"
  android: true
  ios: true

dependency_overrides:
  # file_picker is patched locally (packages/file_picker) to stub the Windows
  # implementation so it compiles against win32 ^6.x alongside all other plugins.
#  file_picker: ^11.0.2
  file_picker:
    path: packages/file_picker
  win32: ^6.3.0
  package_info_plus: 10.1.0
  meta: ^1.18.0



