name: openreader
description: 'A new Flutter project.'
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / Design
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  any_image_view: ^2.1.0
  pinput: ^6.0.2
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^2.0.1

  # State Management
  get: ^4.7.3
  flutter_hooks: ^0.21.3+1

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  sqflite: ^2.4.1
  path: ^1.9.0

  # Logging / Utilities
  logger: ^2.7.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  intl: ^0.20.2

  # Networking
  internet_connection_checker_plus: ^2.9.1+2

  # Auth / Security
  smart_auth: ^3.2.0
  local_auth: ^3.0.1

  # Media / Files
  file_picker: ^11.0.2
  gal: ^2.3.2
  mobile_scanner: ^7.2.0
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0
  # Pinned (not a caret range): 2.5.0+ raises the Flutter SDK floor to
  # 3.47.0, newer than this project's .fvmrc (3.44.4). See
  # ADR-OPENREADER-pdf-library before bumping this.
  pdfrx: 2.4.8
  # See ADR-OPENREADER-office-libraries. docx_file_viewer renders Word
  # documents natively; excel_plus is a parser only (no UI) - the Excel
  # reader's grid widget is first-party.
  docx_file_viewer: ^1.0.4
  # TASK-009 (Open From Other Apps, BRD §7.7): receives ACTION_VIEW/
  # ACTION_SEND intents for supported document types.
  receive_sharing_intent: ^1.9.0
  excel_plus: ^2.22.0
  # ODF-P5-03: was already transitive via docx_file_viewer/excel_plus;
  # promoted to direct since ZipSafetyGuard imports it to inspect a DOCX/XLSX
  # ZIP container's central directory before either library decompresses it.
  archive: ^4.3.0

  # Weather Pulse - Charts / Animations / Fonts
  fl_chart: ^0.69.0
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Weather Pulse - Home screen widgets, notifications, background
  home_widget: ^0.7.0
  workmanager: ^0.6.0
  timezone: ^0.11.0
  flutter_timezone: ^4.1.0

  # Platform / Device
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  permission_handler: ^12.0.2
  geolocator: ^14.0.2
  device_info_plus: ^13.1.0
  flutter_udid: ^4.1.3
  package_info_plus: ^9.0.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  sqflite_common_ffi: ">=2.3.6 <2.4.0"
  flutter_test:
    sdk: flutter

  # Linting / Tooling
  flutter_lints: ^6.0.0

  # App Branding / Assets
  # rename_app removed: it hard-pins xml ^6.5.0 (even at its latest 1.6.6),
  # which conflicts with excel_plus's xml ^7.0.1 requirement. It's a one-shot
  # setup CLI (rename the bundle ID/app name), not referenced anywhere else
  # in this repo - see ADR-OPENREADER-office-libraries.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/

  # OpenReader is offline-only (BRD - zero network calls), so type is bundled
  # as local variable-font assets instead of package:google_fonts' default
  # runtime-download behavior. Each weight below maps onto the same variable
  # font file; Flutter/Skia renders the matching instance.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
        - asset: assets/fonts/Inter.ttf
          weight: 800
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#F8FAFC"
  color_dark: "#000000"
  android: true
  ios: true

dependency_overrides:
  # file_picker is patched locally (packages/file_picker) to stub the Windows
  # implementation so it compiles against win32 ^6.x alongside all other plugins.
#  file_picker: ^11.0.2
  file_picker:
    path: packages/file_picker
  win32: ^6.3.0
  package_info_plus: 10.1.0
  meta: ^1.18.0



#dart run flutter_launcher_icons
#flutter pub run flutter_native_splash:create
#rename setAppName --targets ios,android,web,macos,windows,linux --value "Onkur Customer"
#rename setBundleId --targets ios,android,macos,linux,windows --value "com.onkur.customer"
#find lib -type f -name "*.dart" -exec sed -i '' 's/package:com.onkur.customer\//package:customer\//g' {} +
